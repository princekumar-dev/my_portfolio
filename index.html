<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Android Chrome paints its status/URL bar from theme-color; these match
         the site palette and JS keeps the content current on theme toggle. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFBFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />
    <meta name="author" content="Prince R" />
    <meta
      name="description"
      content="Prince R - AI & Data Science Engineer. A light-themed, animated portfolio showcasing projects, skills, and experience building intelligent, data-driven applications."
    />
    <meta name="keywords" content="Prince R, AI Engineer, Data Science, Machine Learning, Full Stack Developer, React, Portfolio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prince R - AI & Data Science Engineer" />
    <meta
      property="og:description"
      content="Animated portfolio showcasing projects, skills, and experience building intelligent, data-driven applications."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prince R - AI & Data Science Engineer Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prince R - AI & Data Science Engineer" />
    <meta
      name="twitter:description"
      content="Animated portfolio showcasing projects, skills, and experience building intelligent, data-driven applications."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Playfair+Display:wght@700&family=Sora:wght@600&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
      media="print" onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Playfair+Display:wght@700&family=Sora:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" /></noscript>

    <title>Prince R - AI & Data Science Engineer</title>
